[build]
  command = "node --test tests/tyrant-combat.test.mjs tests/capture-animation.test.mjs tests/boss-background.test.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/core-functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/checkout-setup"
  to = "/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/account-return.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"

name: TREE continuation checks

on:
  push:
    branches:
      - feature/tree-paid-continue
  pull_request:
    paths:
      - 'app/game/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tree-continue-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Temporary until the Sui dependency lockfile is regenerated and committed.
      - name: Install declared dependencies
        run: npm install --no-audit --no-fund
      - name: Run payment regression tests
        run: npm run test:payments
      - name: Build game
        run: npm run build

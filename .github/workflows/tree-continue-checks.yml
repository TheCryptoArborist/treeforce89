name: TREE continuation checks

on:
  push:
    branches:
      - feature/tree-paid-continue
  pull_request:
    paths:
      - 'app/game/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tree-continue-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated payment tests
        run: npm run test:payments
